services:

  mysql:
    image: mysql:8.4
    container_name: contact-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 9876
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p9876"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    container_name: contact-redis
    ports:
      - "16379:6379"

  config-server:
    build:
      context: ./config-server
    container_name: contact-config-server
    ports:
      - "18888:8888"

  eureka-server:
    build:
      context: ./eureka-server
    container_name: contact-eureka-server
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "18761:8761"
    depends_on:
      - config-server

  user:
    build:
      context: ./user
    container_name: contact-user
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 9876
    ports:
      - "18084:8084"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started

  master:
    build:
      context: ./master
    container_name: contact-master
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/master_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 9876
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "18083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started

  auth:
    build:
      context: ./auth
    container_name: contact-auth
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      USER_SERVICE_URL: http://user:8084
    ports:
      - "18081:8081"
    depends_on:
      - config-server
      - eureka-server
      - user

  contact-management:
    build:
      context: ./contact-management
    container_name: contact-management
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/contact_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 9876
      PUBLIC_BASE_URL: http://localhost:8085
    ports:
      - "18080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_started
      eureka-server:
        condition: service_started

  gateway:
    build:
      context: ./gateway
    container_name: contact-gateway
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    ports:
      - "18085:8085"
    depends_on:
      - config-server
      - eureka-server
      - auth
      - user
      - master
      - contact-management

volumes:
  mysql-data:
