server:
  port: 8085

spring:
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_FIRST

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                  - "http://127.0.0.1:5173"
                  - "https://contact-management-project-phi.vercel.app"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                exposedHeaders:
                  - Authorization
                  - Content-Disposition
                  - Content-Type
                  - Content-Length
                allowCredentials: true
                maxAge: 3600

          routes:
            - id: auth-service
              uri: https://auth-production-bd55.up.railway.app
              predicates:
                - Path=/auth/**

            - id: user-service
              uri: lb://USER
              predicates:
                - Path=/users/**

            - id: master-service
              uri: lb://MASTER
              predicates:
                - Path=/master/**

            - id: contact-service
              uri: lb://CONTACT-MANAGEMENT
              predicates:
                - Path=/contact/**

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:contact-management-auth-secret-key-2026}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.loadbalancer: INFO
    org.springframework.security: INFO



